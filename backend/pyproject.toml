[project]
name = "drishtik-backend"
version = "0.1.0"
description = "Backend API for Drishtik Forensic Analysis Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.1",
    "pydantic>=2.7.4",
    "pydantic-settings>=2.3.4",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.1",
    "pwdlib[argon2]>=0.2.0",
    "pyjwt>=2.8.0",
    "opencv-python>=4.8.0",
    "ultralytics>=8.0.0",
    "reportlab>=4.0.0",
    "imageio-ffmpeg>=0.4.9",
    "python-multipart>=0.0.6",
    "tzdata; sys_platform == \"win32\"",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.2",
    "pytest-asyncio>=0.23.7",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

